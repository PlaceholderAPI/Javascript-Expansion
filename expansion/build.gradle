plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '7.0.0'
    id 'com.coditory.manifest' version '0.1.14'
}

group 'at.helpch.papi.expansion.javascript'
version '1.0.0'
archivesBaseName = "Javascript-Expansion"

sourceCompatibility = 1.8
targetCompatibility = 1.8
repositories {
    mavenCentral()
    maven {
        url = "https://repo.glaremasters.me/repository/public/"
    }
    maven {
        url = 'https://repo.helpch.at/releases'
    }
    maven {
        url = "https://repo.codemc.io/repository/hytale/"
    }
}

dependencies {
    implementation project(':evaluator')
    implementation project(':evaluator-api')
    compileOnly 'com.hypixel.hytale:Server:2026.01.17-4b0f30090'
    compileOnly 'at.helpch:placeholderapi-hytale:1.0.2'
    compileOnly 'org.jetbrains:annotations:21.0.1'
    testImplementation group: 'junit', name: 'junit', version: '4.12'
}

