plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.0'
    id 'com.coditory.manifest' version '1.1.0'
}

group 'at.helpch.papi.expansion.javascript'
version '1.0.0'
//archivesBaseName = "Javascript-Expansion"

repositories {
    mavenCentral()
    maven { url "https://repo.glaremasters.me/repository/public/" }
    maven { url 'https://repo.helpch.at/releases' }
    maven { url "https://maven.hytale.com/release/" }
}

dependencies {
    implementation project(':evaluator')
    implementation project(':evaluator-api')

    compileOnly 'com.hypixel.hytale:Server:latest.release'
    compileOnly "org.yaml:snakeyaml:2.5"
    compileOnly 'at.helpch:placeholderapi-hytale:1.0.5'
    compileOnly 'org.jetbrains:annotations:21.0.1'
    testImplementation group: 'junit', name: 'junit', version: '4.12'
}

